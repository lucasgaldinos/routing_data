[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-data"
version = "0.1.0"
description = "TSPLIB95 ETL Converter - Convert TSPLIB/VRP instances to JSON and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TCC Routing Data Project", email = "lucasgaldinos@example.com" },
]
license = { text = "MIT" }
keywords = ["tsp", "vrp", "routing", "optimization", "tsplib95", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "click>=8.3.0",
    "duckdb>=1.4.0",
    "pandas>=2.3.3",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "pytest-cov>=4.0.0", "black>=23.0.0", "mypy>=1.5.0"]

[project.urls]
Homepage = "https://github.com/lucasgaldinos/Routing_data"
Repository = "https://github.com/lucasgaldinos/Routing_data.git"
Issues = "https://github.com/lucasgaldinos/Routing_data/issues"

[project.scripts]
converter = "converter.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.package-data]
converter = ["py.typed"]
tsplib_parser = ["py.typed"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
follow_imports = "normal"
strict = true

# duckdb / psutil / pandas ship no py.typed marker (or partial coverage); skip
# their stubs so real src errors are not drowned under import-untyped noise.
[[tool.mypy.overrides]]
module = ["duckdb", "psutil", "pandas"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S", "RUF", "TCH"]
ignore = ["ANN401"]                                                # Any is the explicit JSON / data-model boundary

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
] # assert is idiomatic in pytest; tests need no annotation mandate

[tool.ruff.lint.isort]
known-first-party = ["converter", "tsplib_parser"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false          # Enforce return type annotation for __init__ (-> None)
suppress-dummy-args = false        # Require type annotations even for unused variables (e.g., _arg)
suppress-none-returning = false   # Force you to explicitly write -> None for functions


[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = "dynamic"

