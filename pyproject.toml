[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-data"
version = "0.1.0"
description = "TSPLIB95 ETL Converter - Convert TSPLIB/VRP instances to JSON and DuckDB"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "TCC Routing Data Project", email = "lucasgaldinos@example.com" },
]
license = { text = "MIT" }
keywords = ["tsp", "vrp", "routing", "optimization", "tsplib95", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "click>=8.3.0",
    "duckdb>=1.5.6",
    "pandas>=2.3.3",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Mirror of `[dependency-groups].dev` below, kept for `pip install -e ".[dev]"` users.
# The uv group is canonical (CI runs `uv sync --dev`); change both lists together.
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-cov>=4.0.0", "ruff>=0.17.0"]

[project.urls]
Homepage = "https://github.com/lucasgaldinos/Routing_data"
Repository = "https://github.com/lucasgaldinos/Routing_data.git"
Issues = "https://github.com/lucasgaldinos/Routing_data/issues"

[project.scripts]
converter = "converter.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
converter = ["py.typed"]
tsplib_parser = ["py.typed"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
follow_imports = "normal"
strict = true

# duckdb / psutil / pandas ship no py.typed marker (or partial coverage); skip
# their stubs so real src errors are not drowned under import-untyped noise.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Single module under test; derived from the filename prefix",
    "integration: Two or more modules composed, a CLI runner, or a compositional adapter",
    "e2e: Full scan -> parse -> transform -> write -> database chain across packages",
    "performance: Asserts on time or resources",
    "slow: Measured wall time above 1 second",
    "requires_dataset: Opens files under datasets_raw/**",
    "regression: Guards a specific fixed defect named in the docstring",
    "cli: Drives click.testing.CliRunner",
    "database: Opens a DuckDB database",
    "serial: Unsafe under xdist",
]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S", "RUF", "TCH"]
ignore = ["ANN401"]                                                # Any is the explicit JSON / data-model boundary

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
] # assert is idiomatic in pytest; tests need no annotation mandate

[tool.ruff.lint.isort]
known-first-party = ["converter", "tsplib_parser"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false          # Enforce return type annotation for __init__ (-> None)
suppress-dummy-args = false        # Require type annotations even for unused variables (e.g., _arg)
suppress-none-returning = false   # Force you to explicitly write -> None for functions


[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "ruff>=0.17.0",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

